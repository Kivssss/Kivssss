<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9CFF"/>
      <stop offset="1" stop-color="#B4D0FF"/>
    </linearGradient>
    <pattern id="dirt" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#866043"/>
      <rect x="5" y="5" width="5" height="5" fill="#6B4A32"/>
      <rect x="25" y="0" width="5" height="5" fill="#9B7653"/>
      <rect x="15" y="15" width="5" height="5" fill="#9B7653"/>
      <rect x="30" y="20" width="5" height="5" fill="#6B4A32"/>
      <rect x="0" y="25" width="5" height="5" fill="#9B7653"/>
      <rect x="20" y="30" width="5" height="5" fill="#6B4A32"/>
      <rect x="35" y="35" width="5" height="5" fill="#9B7653"/>
      <rect x="10" y="35" width="5" height="5" fill="#6B4A32"/>
    </pattern>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#866043"/>
      <rect x="5" y="25" width="5" height="5" fill="#6B4A32"/>
      <rect x="25" y="20" width="5" height="5" fill="#9B7653"/>
      <rect x="15" y="30" width="5" height="5" fill="#9B7653"/>
      <rect x="30" y="30" width="5" height="5" fill="#6B4A32"/>
      <rect x="10" y="35" width="5" height="5" fill="#6B4A32"/>
      <rect x="0" y="0" width="40" height="10" fill="#5D9B3A"/>
      <rect x="5" y="0" width="5" height="5" fill="#6FB043"/>
      <rect x="20" y="5" width="5" height="5" fill="#4A7D2E"/>
      <rect x="30" y="0" width="5" height="5" fill="#6FB043"/>
      <rect x="0" y="10" width="5" height="5" fill="#5D9B3A"/>
      <rect x="15" y="10" width="5" height="5" fill="#4A7D2E"/>
      <rect x="15" y="15" width="5" height="5" fill="#5D9B3A"/>
      <rect x="30" y="10" width="5" height="5" fill="#5D9B3A"/>
    </pattern>
    <pattern id="stone" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#8A8A8A"/>
      <rect x="0" y="5" width="5" height="5" fill="#747474"/>
      <rect x="10" y="0" width="5" height="5" fill="#747474"/>
      <rect x="15" y="10" width="5" height="5" fill="#747474"/>
      <rect x="5" y="15" width="5" height="5" fill="#A0A0A0"/>
      <rect x="10" y="10" width="5" height="5" fill="#A0A0A0"/>
    </pattern>
    <pattern id="leaves" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3E8A2A"/>
      <rect x="0" y="0" width="5" height="5" fill="#2F6B1F"/>
      <rect x="10" y="5" width="5" height="5" fill="#55A83A"/>
      <rect x="15" y="15" width="5" height="5" fill="#2F6B1F"/>
      <rect x="5" y="10" width="5" height="5" fill="#2F6B1F"/>
      <rect x="0" y="15" width="5" height="5" fill="#55A83A"/>
    </pattern>
    <pattern id="log" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#6B5233"/>
      <rect x="5" y="0" width="5" height="20" fill="#574129"/>
      <rect x="15" y="0" width="5" height="10" fill="#7D6340"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>
  <rect x="200" y="25" width="60" height="60" fill="#FFF7B0"/>
  <rect x="210" y="35" width="40" height="40" fill="#FFE45C"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" from="-300 0" to="1100 0" dur="45s" begin="-20s" repeatCount="indefinite"/>
    <rect x="0" y="40" width="180" height="20"/><rect x="30" y="30" width="100" height="10"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" from="-300 0" to="1100 0" dur="60s" begin="-45s" repeatCount="indefinite"/>
    <rect x="0" y="80" width="140" height="15"/><rect x="20" y="70" width="80" height="10"/>
  </g>

  <!-- Trees -->
  <rect x="60" y="100" width="100" height="60" fill="url(#leaves)"/><rect x="80" y="80" width="60" height="20" fill="url(#leaves)"/><rect x="100" y="140" width="20" height="100" fill="url(#log)"/>
  <rect x="900" y="100" width="100" height="60" fill="url(#leaves)"/><rect x="920" y="80" width="60" height="20" fill="url(#leaves)"/><rect x="940" y="140" width="20" height="100" fill="url(#log)"/>

  <!-- Creeper -->
  <g>
    <rect x="780" y="150" width="40" height="40" fill="#5DB04A"/>
    <rect x="785" y="190" width="30" height="35" fill="#4C9A3F"/>
    <rect x="780" y="225" width="40" height="15" fill="#3D7A30"/>
    <rect x="785" y="160" width="10" height="10" fill="#111111"/>
    <rect x="805" y="160" width="10" height="10" fill="#111111"/>
    <rect x="795" y="170" width="10" height="15" fill="#111111"/>
    <rect x="790" y="175" width="5" height="15" fill="#111111"/>
    <rect x="805" y="175" width="5" height="15" fill="#111111"/>
    <g fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0;0.7;0" keyTimes="0;0.85;0.88;0.91;0.94;1" dur="6s" repeatCount="indefinite"/>
      <rect x="780" y="150" width="40" height="40"/><rect x="785" y="190" width="30" height="35"/><rect x="780" y="225" width="40" height="15"/>
    </g>
  </g>

  <rect x="0" y="240" width="1000" height="40" fill="url(#grass)"/>
  <rect x="0" y="280" width="1000" height="40" fill="url(#dirt)"/>

  <!-- Title -->
  <g font-family="'Courier New', Courier, monospace" font-weight="900" text-anchor="middle">
    <text x="506" y="136" font-size="92" letter-spacing="8" fill="#1E1E1E">KIVSSS</text>
    <text x="500" y="130" font-size="92" letter-spacing="8" fill="url(#stone)" stroke="#2A2A2A" stroke-width="3">KIVSSS</text>
    <text x="502" y="187" font-size="22" letter-spacing="2" fill="#3F3F3F">ENGINEERING STUDENT • DEVELOPER</text>
    <text x="500" y="185" font-size="22" letter-spacing="2" fill="#FFFFFF">ENGINEERING STUDENT • DEVELOPER</text>
  </g>

  <!-- Splash text -->
  <g transform="translate(800 118) rotate(-18)" font-family="'Courier New', Courier, monospace" font-weight="900" font-size="18" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="0.8s" repeatCount="indefinite"/>
      <text x="2" y="2" fill="#3F3F00">Level 23 Engineer!</text>
      <text x="0" y="0" fill="#FFFF55">Level 23 Engineer!</text>
    </g>
  </g>
</svg>
